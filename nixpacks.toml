[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = ["python -m pip install --upgrade pip", "pip install -r backend/requirements.txt || pip install -r requirements.txt"]

[phases.build]
cmds = []

[start]
cmd = "cd backend 2>/dev/null && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} || uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
